name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Dependencias de Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 \
            libdbus-1-3 libglib2.0-0 libxcb-cursor0
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - name: pytest
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set +e
          python -X faulthandler -m pytest -v 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Mostrar el final del registro como anotación para verlo en la web.
            echo "::error title=pytest falló (código $status)::$(tail -n 25 pytest.log | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
          fi
          exit "$status"
